          - paragraph [ref=e427]: An AI SDR (Sales Development Representative) automates the research, scoring, enrichment, and outreach tasks traditionally performed by a human SDR. A human SDR costs $4,000–$6,000/month and typically delivers 40–60 leads. Prospecting OS delivers 500+ scored, enriched leads on the Managed Growth plan at $3,500/month — running 24/7, with no sick days, no training ramp, and no turnover.
